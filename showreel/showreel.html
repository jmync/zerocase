<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Showreel — Jo Mary Ynna Albasin</title>
<!-- Portfolio showreel, 1920 × 1080. Every frame is a pure function of t: seek(t) draws it.
     render.js steps it frame by frame into out/showreel.mp4. Open with ?t=12.5 to look at one moment,
     or with no query to play it in real time (rough; videos seek as they go). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
/* The look follows the portfolio site (Resume/styles.css, dark theme): Archivo display, Inter body, JetBrains Mono
   labels, a dot-grid "design canvas" with rulers, square-ish tags, and one selected word per title (the site's .sel). */
:root {
  --bg: #0e0e0f; --ink: #f1efea; --soft: #bbb8b0; --mute: #8b8880;
  --gold: #d4b07a; --gold-hi: #e2c590; --line: rgba(255, 255, 255, .1);
  --display: 'Archivo', Inter, sans-serif; --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
  font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.mono { font-family: var(--mono); }

/* Selected word: a selection box with corner handles and an optional tag (data-tag), drawn in by --sp (0 → 1) */
em { font-style: normal; position: relative; display: inline-block; isolation: isolate; --sp: 0; }
em::before { content: ''; position: absolute; z-index: -1; inset: .05em -.07em -.02em;
  background: color-mix(in srgb, var(--acc, var(--gold)) 17%, transparent); border: max(1.5px, .02em) solid var(--acc, var(--gold));
  opacity: var(--sp); transform: scale(calc(1.05 - .05 * var(--sp))); }
em > .h { position: absolute; z-index: 1; width: max(8px, .08em); height: max(8px, .08em); background: var(--bg);
  border: max(1.5px, .018em) solid var(--acc, var(--gold)); opacity: var(--sp); }
em > .h.tl { left: -.07em; top: .05em; transform: translate(-50%, -50%); }
em > .h.tr { right: -.07em; top: .05em; transform: translate(50%, -50%); }
em > .h.bl { left: -.07em; bottom: -.02em; transform: translate(-50%, 50%); }
em > .h.br { right: -.07em; bottom: -.02em; transform: translate(50%, 50%); }
em[data-tag]::after { content: attr(data-tag); position: absolute; left: -.07em; top: calc(100% + 14px); font: 600 17px/1 var(--mono);
  padding: 6px 10px; border-radius: 2px; background: var(--acc, var(--gold)); color: #17120a; white-space: nowrap; opacity: var(--sp); }

/* Ground: dot grid, rulers, soft glows */
#grid { background-image: radial-gradient(rgba(255,255,255,.17) 1.2px, transparent 1.6px); background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse 82% 78% at 50% 52%, #000 35%, transparent 88%); }
#rulers .rt { position: absolute; left: 0; right: 0; top: 92px; height: 12px; border-bottom: 1px solid rgba(255,255,255,.07);
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 1px, transparent 1px 100px) left bottom / 100% 12px no-repeat,
    repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 1px, transparent 1px 10px) left bottom / 100% 5px no-repeat; }
#rulers .rl { position: absolute; top: 105px; bottom: 0; left: 0; width: 12px; border-right: 1px solid rgba(255,255,255,.07);
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.2) 0 1px, transparent 1px 100px) right top / 12px 100% no-repeat,
    repeating-linear-gradient(180deg, rgba(255,255,255,.1) 0 1px, transparent 1px 10px) right top / 5px 100% no-repeat; }
.glow { position: absolute; border-radius: 50%; opacity: 0; }
#grain { opacity: .06; mix-blend-mode: overlay; }
#vignette { background: radial-gradient(ellipse 85% 80% at 50% 50%, transparent 58%, rgba(0,0,0,.5) 100%); }
#black { background: #000; }

/* HUD */
#hud-l, #hud-r { position: absolute; top: 38px; font: 500 15px/1 var(--mono); color: var(--mute); }
#hud-l { left: 56px; display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 600; font-size: 17px; }
#hud-l b { font: 700 14px/1 var(--mono); color: var(--bg); background: var(--ink); border-radius: 3px; padding: 7px 6px; }
#hud-l .cur { width: 9px; height: 18px; background: var(--gold); margin-left: -8px; }
#hud-r { right: 56px; display: flex; align-items: center; gap: 12px; letter-spacing: .12em; text-transform: uppercase; }
#hud-r i { width: 9px; height: 9px; border-radius: 1px; background: var(--hud, var(--gold)); }
#hud-r span { color: var(--ink); }

/* Beats */
.beat { position: absolute; inset: 0; visibility: hidden; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
.w > i { display: inline-block; font-style: inherit; will-change: transform; }

.kick { font: 600 15px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--acc, var(--gold)); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font: 500 17px/1 var(--mono); color: var(--ink); padding: 10px 13px; border-radius: 3px;
  border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.04); }
.nameline { font: 500 20px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.nameline b { color: var(--ink); font-weight: 700; } .nameline .sl { color: var(--gold); margin: 0 12px; }

/* Intro */
#intro .k { position: absolute; left: 160px; top: 196px; }
#intro h1 { position: absolute; left: 150px; top: 252px; width: 1700px; font: 800 156px/1 var(--display); letter-spacing: -.045em; color: var(--ink); }
#intro .tag { position: absolute; left: 160px; top: 800px; font: 400 30px/1.35 Inter; color: var(--soft); }
#intro .index { position: absolute; left: 160px; right: 160px; top: 842px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
#intro .index > div { border-top: 1px solid var(--line); padding-top: 20px; }
#intro .index b { display: block; font: 600 15px/1 var(--mono); letter-spacing: .16em; color: var(--gold); margin-bottom: 12px; }
#intro .index strong { display: block; font: 800 36px/1.1 var(--display); letter-spacing: -.03em; color: var(--ink); }
#intro .index span { display: block; font: 400 20px/1.35 Inter; color: var(--soft); margin-top: 6px; }

/* Section card */
.card .num { position: absolute; left: 70px; top: 190px; font: 800 560px/1 var(--display); letter-spacing: -.06em; color: transparent;
  -webkit-text-stroke: 2px color-mix(in srgb, var(--acc) 55%, transparent); }
.card .body { position: absolute; left: 820px; top: 0; bottom: 0; width: 1000px; display: flex; flex-direction: column; justify-content: center; gap: 0; }
.card .logo { height: 96px; margin: 30px 0 26px; display: flex; align-items: center; gap: 22px; }
.card .logo img, .card .logo svg { height: 96px; width: auto; display: block; }
.card h2 { font: 800 124px/1 var(--display); letter-spacing: -.045em; color: var(--ink); }
.card .desc { font: 400 33px/1.38 Inter; color: var(--soft); margin: 28px 0 36px; max-width: 940px; }
.card .desc b { color: var(--ink); font-weight: 600; }
.card .stat { display: inline-flex; align-items: baseline; gap: 16px; margin: -8px 0 32px; padding: 14px 20px; border-radius: 3px;
  background: color-mix(in srgb, var(--acc) 14%, transparent); border: 1.5px solid var(--acc); align-self: flex-start; }
.card .stat strong { font: 800 48px/1 var(--display); color: var(--ink); letter-spacing: -.03em; }
.card .stat span { font: 400 26px/1 Inter; color: var(--ink); }

/* Caption, left column */
.cap { position: absolute; left: 96px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
.cap .t { font: 800 52px/1.08 var(--display); letter-spacing: -.035em; color: var(--ink); }
.cap .s { font: 400 25px/1.45 Inter; color: var(--soft); }
.cap .chips .chip { font-size: 16px; padding: 9px 12px; }

/* Browser window */
.win { position: absolute; border-radius: 12px; overflow: hidden; background: #0d0f15; transform-origin: 50% 50%;
  box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.09); will-change: transform; }
.win .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #18181b; border-bottom: 1px solid rgba(255,255,255,.06); }
.win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3f4c; }
.win .bar i:nth-child(1) { background: #e0806f; } .win .bar i:nth-child(2) { background: #e6c46e; } .win .bar i:nth-child(3) { background: #7fcf9a; }
.win .bar span { margin-left: 18px; flex: 1; max-width: 460px; height: 24px; border-radius: 4px; background: #0e0e0f; color: #9b988f;
  font: 500 13px/24px var(--mono); padding: 0 12px; overflow: hidden; white-space: nowrap; }
.win .view { position: relative; overflow: hidden; background: #0b0c10; }
.win .view img { display: block; width: 100%; will-change: transform; }
.win.light { background: #fff; } .win.light .bar { background: #ecebe8; border-color: rgba(0,0,0,.06); } .win.light .bar span { background: #fff; color: #6c6961; }
.win.bare .bar { display: none; }

.ring { position: absolute; border: 2px solid var(--acc); border-radius: 3px; box-shadow: 0 0 0 9999px rgba(0,0,0,.38), 0 0 34px color-mix(in srgb, var(--acc) 60%, transparent); opacity: 0; }
.scrim { position: absolute; left: 0; top: 0; bottom: 0; width: 900px; background: linear-gradient(90deg, rgba(14,14,15,.94) 0%, rgba(14,14,15,.78) 55%, transparent 100%); opacity: 0; }

/* Strip (the product's lifecycle) */
.strip .head { position: absolute; left: 0; right: 0; top: 240px; text-align: center; }
.strip .head .t { font: 800 70px/1.1 var(--display); letter-spacing: -.04em; color: var(--ink); margin-top: 24px; }
.strip .row { position: absolute; left: 100px; right: 100px; top: 560px; display: flex; justify-content: space-between; }
.strip .line { position: absolute; left: 195px; right: 195px; top: 600px; height: 2px; background: rgba(255,255,255,.1); }
.strip .line b { position: absolute; left: 0; top: -1px; height: 4px; border-radius: 1px; background: var(--acc); box-shadow: 0 0 20px var(--acc); width: 0; }
.strip .node { position: relative; width: 190px; text-align: center; }
.strip .node .dot { width: 80px; height: 80px; margin: 0 auto; border-radius: 6px; border: 2px solid rgba(255,255,255,.14); background: #141416;
  display: grid; place-items: center; font: 600 22px/1 var(--mono); color: var(--mute); }
.strip .node.on .dot { border-color: var(--acc); color: var(--ink); background: color-mix(in srgb, var(--acc) 22%, #141416); box-shadow: 0 0 36px color-mix(in srgb, var(--acc) 55%, transparent); }
.strip .node .lb { margin-top: 22px; font: 600 24px/1.2 Inter; color: var(--mute); }
.strip .node.on .lb { color: var(--ink); }
.strip .node .sb { margin-top: 8px; font: 400 18px/1.35 Inter; color: var(--mute); opacity: 0; }
.strip .node.on .sb { opacity: 1; color: var(--soft); }

/* Wall */
.wall .plane { position: absolute; left: 50%; top: 50%; width: 2600px; height: 1500px; margin: -750px 0 0 -1300px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px; transform-style: preserve-3d; }
.wall .plane .win { position: relative; }
.wall .over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px;
  background: radial-gradient(ellipse 50% 42% at 50% 50%, rgba(14,14,15,.94) 0%, rgba(14,14,15,.74) 55%, transparent 100%); }
.wall .over .t { font: 800 84px/1.06 var(--display); letter-spacing: -.045em; color: var(--ink); max-width: 1300px; }
.wall .over .chips { justify-content: center; max-width: 1150px; }
.wall .over .note { font: 400 20px/1.4 Inter; color: var(--soft); }
.wall .view img { height: 100%; object-fit: cover; object-position: top; }

/* Clip frame */
.clipframe { position: absolute; left: 640px; top: 192px; width: 1200px; height: 675px; border-radius: 12px; overflow: hidden;
  box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); background: #000; }
.clipframe video { width: 100%; height: 100%; display: block; object-fit: cover; }
.capstack { position: absolute; left: 96px; top: 0; bottom: 0; width: 520px; }
.capstack .cap { left: 0; }

/* Flow: app screens in phones */
.flow .fphone { position: absolute; transform-origin: 50% 60%; filter: drop-shadow(0 34px 50px rgba(0,0,0,.55)); }
.flow .fphone img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.flow .fphone img + img { opacity: 0; }

/* Phones */
.phones .phone { position: absolute; width: 360px; height: 779px; border-radius: 46px; overflow: hidden; background: #000;
  border: 10px solid #1b1b1e; box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }
.phones .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }

/* Brand collage */
.brand .item { position: absolute; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
.brand .item img { display: block; width: 100%; }

/* End: the portrait as a selected layer, as on the site */
.end .frame { position: absolute; left: 210px; top: 150px; width: 540px; height: 849px; }
.end .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; /* in colour: the user reversed black and white */
  -webkit-mask-image: url(media/me/portrait-mask.png); -webkit-mask-size: 100% 100%; mask-mode: luminance; -webkit-mask-mode: luminance; }
.end .frame .box { position: absolute; inset: 0; border: 1.5px solid var(--gold); }
.end .frame .h { position: absolute; width: 11px; height: 11px; background: var(--bg); border: 1.5px solid var(--gold); transform: translate(-50%, -50%); }
.end .frame .ftag, .end .frame .dim { position: absolute; font: 600 15px/1 var(--mono); padding: 6px 9px; border-radius: 2px; background: var(--gold); color: #17120a; white-space: nowrap; }
.end .frame .ftag { left: -1px; top: -38px; }
.end .frame .dim { left: 50%; bottom: -40px; transform: translateX(-50%); }
.end .body { position: absolute; left: 880px; top: 0; bottom: 0; width: 960px; display: flex; flex-direction: column; justify-content: center; }
.end h2 { font: 800 140px/1 var(--display); letter-spacing: -.045em; color: var(--ink); margin-top: 34px; }
.end .line { font: 400 30px/1.45 Inter; color: var(--soft); margin-top: 58px; max-width: 880px; }
.end .links { margin-top: 46px; display: flex; flex-direction: column; gap: 16px; }
.end .links div { font: 500 24px/1 var(--mono); color: var(--ink); display: flex; gap: 0; align-items: center; }
.end .links div span { color: var(--mute); width: 150px; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="ground"></div>
  <div class="layer" id="grid"></div>
  <div class="layer" id="glows"></div>
  <div class="layer" id="rulers"><div class="rt"></div><div class="rl"></div></div>
  <div class="layer" id="beats"></div>
  <div class="layer" id="hudband" style="bottom:auto;height:150px;background:linear-gradient(rgba(14,14,15,.94),rgba(14,14,15,.62) 55%,transparent)"></div>
  <div id="hud-l"><b>JM</b>albasin<i class="cur"></i></div>
  <div id="hud-r"><i></i><span class="mono" id="hud-n" style="color:var(--mute)"></span><span id="hud-t"></span></div>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="grain"></div>
  <div class="layer" id="black"></div>
</div>

<script>
// ---------- time ----------
const FPS = 30, BPM = 100, BEAT = 60 / BPM, BAR = BEAT * 4;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  out5: (x) => 1 - Math.pow(1 - x, 5),
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  in: (x) => x * x * x,
  back: (x) => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const tw = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

function put(el, o) {
  let tr = '';
  if (o.x || o.y || o.z) tr += `translate3d(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px,${(o.z || 0).toFixed(2)}px) `;
  if (o.rx) tr += `rotateX(${o.rx.toFixed(3)}deg) `;
  if (o.ry) tr += `rotateY(${o.ry.toFixed(3)}deg) `;
  if (o.r) tr += `rotate(${o.r.toFixed(3)}deg) `;
  if (o.s != null) tr += `scale(${o.s.toFixed(4)}) `;
  el.style.transform = tr || 'none';
  if (o.op != null) el.style.opacity = clamp(o.op).toFixed(3);
  if (o.blur != null) el.style.filter = o.blur > 0.05 ? `blur(${o.blur.toFixed(2)}px)` : 'none';
}

// Words that rise out of a mask: <… class="split">
function split(el) {
  const walk = (node) => {
    for (const c of [...node.childNodes]) {
      if (c.nodeType === 3) {
        const frag = document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach((p) => {
          if (!p) return;
          if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
          else { const w = document.createElement('span'); w.className = 'w'; const i = document.createElement('i'); i.textContent = p; w.appendChild(i); frag.appendChild(w); }
        });
        c.replaceWith(frag);
      } else if (c.nodeType === 1 && !c.classList.contains('w')) walk(c);
    }
  };
  walk(el);
  // punctuation right after the selected word stays on its line ("crown?" never breaks before the "?")
  $$('em', el).forEach((em) => {
    const nx = em.nextSibling;
    if (nx && nx.nodeType === 1 && nx.classList.contains('w') && /^[.,!?;:…’”)]+$/.test(nx.textContent)) {
      const g = document.createElement('span'); g.style.whiteSpace = 'nowrap';
      em.replaceWith(g); g.append(em, nx);
    }
  });
  // the selected word gets the site's corner handles
  $$('em', el).forEach((em) => ['tl', 'tr', 'bl', 'br'].forEach((k) => em.appendChild(h(`<b class="h ${k}"></b>`))));
}
// Words rise in one after another; then the selected word's box draws in (at selAt, or just after the last word)
function rise(el, t, start, stagger = 0.05, len = 0.7, selAt = null) {
  const words = $$('.w > i', el);
  words.forEach((i, n) => {
    const p = tw(t, start + n * stagger, start + n * stagger + len, E.out5);
    i.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
  });
  const s0 = selAt ?? start + words.length * stagger + len * 0.55;
  $$('em', el).forEach((em) => em.style.setProperty('--sp', tw(t, s0, s0 + 0.3, E.out).toFixed(3)));
}

// ---------- the reel ----------
const ACC = { gold: '#d4b07a', specs: '#7d8cff', buk: '#e3342b', nkma: '#d6409f' };
const BUK_VIDEO = '../../explore-bukidnon-app/docs/brand/social/campaign/out/bukven-teaser-youtube.mp4';
const BUK_MOTION = '../../explore-bukidnon-app/docs/brand/social/campaign/out/bukven-motion-youtube.mp4';
const BUK_SCREENS = 'media/bukven/screens/';
const BUK_MARK = `<svg viewBox="0 0 243.4 248" class="bukmark"><g transform="translate(24 24)"><clipPath id="m0"><rect x="-20" y="-20" width="260" height="180"/></clipPath><clipPath id="m0l"><rect x="8.6" y="-20" width="260" height="240"/></clipPath>
<g fill="none" stroke="#fff" stroke-width="20" stroke-linejoin="miter" stroke-miterlimit="10">
<path pathLength="1" d="M8.6 10H142.5A42.9 42.9 0 0 1 149.6 95.21"/>
<path pathLength="1" clip-path="url(#m0l)" d="M-11.4 121.45L47.6 65.99L69.16 89.27L109.42 51.42L174.84 122.72A40.14 40.14 0 0 1 145.26 190H33.84L106.84 121.38L110.84 125.74"/>
<path pathLength="1" clip-path="url(#m0)" d="M106.84 121.38L153.27 172"/></g>
<polygon fill="#fff" points="8.6,0 28.6,0 28.6,30.04 8.6,48.84"/><circle cx="149.7" cy="46.3" r="15.14" fill="#D7020E"/></g></svg>`;

// Sections → beats. Durations sit on the 100 BPM grid (one bar = 2.4 s), so cuts land on the music.
const SECTIONS = [
  { id: 'intro', acc: ACC.gold, beats: [{ type: 'intro', dur: BAR * 3 }] },
  { id: 'buk', acc: ACC.buk, n: '01', title: 'BUKVEN', beats: [
    { type: 'card', dur: BAR, n: '01', kick: 'Project 01 / 03 · 2026', logo: 'buk',
      title: 'BUKVEN', desc: 'Explore Bukidnon: a tourism platform with <b>a mobile app</b>, management portals, a public website and the API behind them.',
      chips: ['Expo · React Native', 'NestJS', 'Prisma', 'PostgreSQL', 'MapLibre'] },
    // The app itself, as its own screens (bukven-screens.js renders them from the brand kit, which redraws each screen from
    // the app's code and the API's data) in the reel's phones. No marketing videos, no brand kit or merch.

      put($('.desc', el), { op: tw(t, 0.4, 0.9), y: lerp(20, 0, tw(t, 0.4, 1.0)) });
      const st = $('.stat', el); if (st) put(st, { op: tw(t, 0.7, 1.0), s: lerp(0.9, 1, tw(t, 0.7, 1.1, E.back)) });
      $$('.chip', el).forEach((c, i) => put(c, { op: tw(t, 0.95 + i * 0.09, 1.25 + i * 0.09), y: lerp(14, 0, tw(t, 0.95 + i * 0.09, 1.35 + i * 0.09, E.back)) }));

  strip(b, sec) {
    const n = b.steps.length;
    const el = h(`<div class="beat strip" style="--acc:${sec.acc}">
      <div class="head"><div class="kick">${b.k}</div><div class="t split">${b.t}</div></div>
      <div class="line"><b></b></div>

    $$('.split', el).forEach(split);
    const a0 = 0.5, a1 = b.dur - 0.5 - (b.hold || 0);
    const at = (i) => a0 + (a1 - a0) * (i / (n - 1));
    const cues = [{ t: 0, kind: 'whoosh', len: 0.6, gain: 0.6 }, ...b.steps.map((s, i) => ({ t: at(i), kind: 'tick', pitch: 1 + i * 0.08 }))];
    return { el, cues, render(t, d) {
      put($('.head .kick', el), { op: tw(t, 0, 0.4) });
      rise($('.head .t', el), t, 0.05, 0.04, 0.6);
      const prog = clamp((t - a0) / (a1 - a0));
      $('.line b', el).style.width = (E.inOut(prog) * 100).toFixed(2) + '%';
      $$('.node', el).forEach((nd, i) => {
        nd.classList.toggle('on', t >= at(i) - 0.02);
        put(nd, { op: tw(t, 0.1 + i * 0.05, 0.5 + i * 0.05), y: lerp(30, 0, tw(t, 0.1 + i * 0.05, 0.6 + i * 0.05)), s: t >= at(i) ? lerp(1.12, 1, tw(t, at(i), at(i) + 0.35)) : 1 });
      });
      const out = tw(t, d - 0.05, d + 0.45, E.in);
      put(el, { op: 1 - out, y: -out * 40 });
    } };
  },

  // One window on the right, pushed in slowly, optional scroll down a tall capture and a zoom onto a detail
  hero(b, sec) {
    const W = b.w || 1180, left = b.left || 650;
    const el = h(`<div class="beat hero" style="--acc:${sec.acc}">
      <div class="stagewin" style="position:absolute;inset:0;perspective:2200px">${frameWin(b.src, b.url, b.light, W)}</div>
      <div class="scrim"></div><div class="ring"></div>
      <div class="cap"><div class="kick">${b.k}</div><div class="t split">${b.t}</div><div class="s">${b.s || ''}</div>
        ${b.chips ? `<div class="chips">${b.chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>` : ''}</div></div>`);
    $$('.split', el).forEach(split);
    const win = $('.win', el), img = $('.view img', el), view = $('.view', el);
    // swap: a second capture crossfades in over the first (the next moment of the same screen)
    const swapImg = b.swap ? view.appendChild(h(`<img src="${b.swap.src}" style="position:absolute;left:0;top:0;opacity:0">`)) : null;
    if (!b.zoom || !b.zoom.rw) $('.ring', el).remove();
    const VH = Math.round(W * (b.aspect || 0.625));
    view.style.height = VH + 'px';
    const top = Math.round((1080 - VH - 40) / 2) + (b.dy || 0);
    win.style.left = left + 'px'; win.style.top = top + 'px'; win.style.transformOrigin = '0 0';
    const cues = [{ t: 0, kind: 'whoosh', len: 0.7 }];
    if (b.zoom) cues.push({ t: b.zoom.at, kind: 'whoosh', len: 0.9, gain: 0.7 }, ...(b.zoom.rw ? [{ t: b.zoom.at + 0.9, kind: 'pop', gain: 0.7 }] : []));
    if (b.swap && !b.swap.quiet) cues.push({ t: b.swap.at, kind: 'impact', gain: 0.6 }, { t: b.swap.at + 0.05, kind: 'shimmer' });
    return { el, cues, render(t, d) {
      const inn = tw(t, 0, 0.95, E.out5);
      put($('.cap .kick', el), { op: tw(t, 0.15, 0.5) });
      rise($('.cap .t', el), t, 0.2, 0.045, 0.6);
      put($('.cap .s', el), { op: tw(t, 0.55, 1.0), y: lerp(14, 0, tw(t, 0.55, 1.0)) });
      $$('.cap .chip', el).forEach((c, i) => put(c, { op: tw(t, 0.8 + i * 0.07, 1.1 + i * 0.07), y: lerp(12, 0, tw(t, 0.8 + i * 0.07, 1.2 + i * 0.07, E.back)) }));
      // window: in from the right in 3D, drifting slowly
      let s = lerp(0.94, 1, inn) + t * 0.006, x = lerp(260, 0, inn), ry = lerp(-24, -7, inn) + t * 1.2, y = lerp(30, 0, inn);
      let tx = 0, ty = 0;
      if (b.zoom) {
        const z = b.zoom, p = tw(t, z.at, z.at + 0.9, E.inOut);
        // focus point (fractions of the capture) → frame point (cx, cy) at scale z.s
        const lx = z.fx * W, ly = 40 + z.fy * VH;
        tx = lerp(0, (z.cx || 1180) - left - z.s * lx, p) - x * p; ty = lerp(0, (z.cy || 540) - top - z.s * ly, p) - y * p;
        s = lerp(s, z.s, p); ry = lerp(ry, 0, p);
        put($('.scrim', el), { op: p });
        const rg = $('.ring', el);

          const rp = tw(t, z.at + 0.8, z.at + 1.2, E.back);

  // Cuts from a finished video, framed, with a caption per cut
  // Cuts from a finished video, framed, with a caption per cut. A cut may set its own `len` (seconds of the reel; the
  // rest share what's left), `rate` (clip seconds per reel second, to quicken a long moment) and `hit` (an impact cue).
  clips(b, sec) {
    const fixed = b.segs.reduce((a, s) => a + (s.len || 0), 0), loose = b.segs.filter((s) => !s.len).length;
    const lens = b.segs.map((s) => s.len || (b.dur - fixed) / loose);
    const starts = lens.map((_, i) => lens.slice(0, i).reduce((a, x) => a + x, 0));
    const segAt = (t) => { let k = 0; while (k + 1 < starts.length && t >= starts[k + 1]) k++; return k; };
    const el = h(`<div class="beat clips" style="--acc:${sec.acc}">
      <div class="clipframe"><video muted preload="auto" src="${b.video}"></video></div>
      <div class="capstack">${b.segs.map((s) => `<div class="cap"><div class="kick">${s.k}</div><div class="t split">${s.t}</div><div class="s">${s.s}</div></div>`).join('')}</div></div>`);
    $$('.split', el).forEach(split);
    const v = $('video', el), frame = $('.clipframe', el), caps = $$('.cap', el);
    VIDEOS.push({ el: v, at: (t) => {
      if (t < 0 || t > b.dur + 0.45) return null;
      const k = segAt(Math.min(t, b.dur - 0.001));
      return b.segs[k].from + (t - starts[k]) * (b.segs[k].rate || 1);
    } });
    const cues = [{ t: 0, kind: 'whoosh', len: 0.7 }, ...starts.slice(1).map((st) => ({ t: st, kind: 'whoosh', len: 0.45, gain: 0.55 })),
      ...b.segs.flatMap((s, i) => (s.hit != null ? [{ t: starts[i] + s.hit, kind: 'impact', gain: 0.8 }, { t: starts[i] + s.hit + 0.05, kind: 'shimmer' }] : []))];
    return { el, cues, render(t, d) {
      const inn = tw(t, 0, 0.8, E.out5), k = segAt(clamp(t, 0, d - 0.001)), lt = t - starts[k];
      const bump = k > 0 ? 1 - tw(lt, 0, 0.35, E.out) : 0;
      frame.style.transform = `perspective(2200px) translate3d(${lerp(240, 0, inn).toFixed(1)}px,0,0) rotateY(${(lerp(-20, -5, inn) + Math.sin(t * 0.6) * 1.5).toFixed(2)}deg) scale(${(lerp(0.94, 1, inn) + bump * 0.025).toFixed(4)})`;
      frame.style.opacity = inn;
      caps.forEach((c, i) => {
        const on = i === k, ct = on ? lt : -1;
        c.style.visibility = on ? 'inherit' : 'hidden'; // never 'visible': it would show through the hidden beat
        if (!on) return;
        put($('.kick', c), { op: tw(ct, 0.05, 0.35) });
        rise($('.t', c), ct, 0.08, 0.04, 0.5);
        put($('.s', c), { op: tw(ct, 0.35, 0.7), y: lerp(12, 0, tw(ct, 0.35, 0.75)) });

      const out = tw(t, d - 0.05, d + 0.45, E.in);

  flow(b, sec) {
    const lens = b.segs.map((s) => s.len), starts = lens.map((_, i) => lens.slice(0, i).reduce((a, x) => a + x, 0));
    const segAt = (t) => { let k = 0; while (k + 1 < starts.length && t >= starts[k + 1]) k++; return k; };
    const PH = 840, PW = Math.round(PH * 0.475), TOP = Math.round((1080 - PH) / 2) + 18;

      ...b.segs.flatMap((s, i) => swapsOf(s).map((w) => ({ t: starts[i] + w.at, kind: 'click', gain: 0.6 })))];
    return { el, cues, render(t, d) {

          p.style.transform = `perspective(2400px) translate3d(${(-out * 70).toFixed(1)}px, ${(lerp(110, 0, q) - gt * 7).toFixed(1)}px, 0) rotateY(${(side * -9 + lerp(-12, 0, q)).toFixed(2)}deg) scale(${(sc * lerp(0.94, 1, q)).toFixed(4)})`;
          p.style.opacity = (q * (1 - out)).toFixed(3);
          $$('img', p).forEach((im, qi) => {
            if (qi === 0) return;

            im.style.opacity = w ? tw(gt, w.at, w.at + 0.35, E.inOut).toFixed(3) : 0;

      caps.forEach((c, i) => {

        if (!on) return;

        put($('.s', c), { op: tw(ct, 0.35, 0.7), y: lerp(12, 0, tw(ct, 0.35, 0.75)) });
      });
      const out = tw(t, d - 0.05, d + 0.45, E.in);
      put(el, { op: 1 - out, x: -out * 80 });
    } };

// ---------- assemble ----------
let DURATION = 0;
const BEATS = [], SECS = [];
// ?part=buk|specs|nkma: one project on its own (for the site), from its card to a fade out, with no HUD
const PART = new URLSearchParams(location.search).get('part');
function assemble() {
  let t = 0;
  for (const sec of PART ? SECTIONS.filter((s) => s.id === PART) : SECTIONS) {
    const list = sec.beats === 'SPECS' ? SPECS_BEATS : sec.beats === 'NKMA' ? NKMA_BEATS : sec.beats;
    const from = t;
    for (const b of list) {
      const built = BUILD[b.type](b, sec);
      beatsEl.appendChild(built.el);
      BEATS.push({ ...built, start: t, dur: b.dur, type: b.type, sec });
      for (const c of built.cues || []) CUES.push({ ...c, t: c.t + t });
      for (const v of VIDEOS) if (v.start == null) v.start = t;
      const level = sec.id === 'intro' ? 'intro' : b.type === 'card' ? 'break' : b.type === 'end' ? 'outro' : 'drive';
      LEVELS.push({ from: t, to: t + b.dur, level });
      t += b.dur;
    }
    SECS.push({ ...sec, from, to: t });
  }
  DURATION = t;
  // a cue before the start (the first card's riser) can't play
  for (let i = CUES.length - 1; i >= 0; i--) if (CUES[i].t < 0) CUES.splice(i, 1);
  if (PART) ['#hud-l', '#hud-r', '#hudband'].forEach((s) => ($(s).style.display = 'none'));
}

// Accent glows: one pair per section, crossfading
const glowsEl = $('#glows');
function makeGlows() {
  for (const s of SECS) {
    const a = h(`<div class="glow" style="left:-280px;top:-320px;width:1300px;height:1100px;background:radial-gradient(closest-side, ${s.acc}2e, ${s.acc}0d 55%, transparent)"></div>`);
    const b = h(`<div class="glow" style="right:-300px;bottom:-380px;width:1400px;height:1200px;background:radial-gradient(closest-side, ${s.acc}24, ${s.acc}0a 55%, transparent)"></div>`);
    glowsEl.append(a, b); s.glows = [a, b];
  }
}

// Film grain
(function grain() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

// ---------- seek ----------
function seek(T) {
  T = clamp(T, 0, DURATION);
  put($('#black'), { op: 1 - tw(T, 0, 0.7) + tw(T, DURATION - 1.4, DURATION - 0.1, E.inOut) });
  // ground
  $('#grid').style.backgroundPosition = `${(-T * 6).toFixed(1)}px ${(-T * 3).toFixed(1)}px`;
  const gp = (T * 61) % 256; $('#grain').style.backgroundPosition = `${(gp * 7) % 256}px ${(gp * 13) % 256}px`;
  for (const s of SECS) {
    const v = tw(T, s.from - 0.6, s.from + 0.6, E.inOut) * (1 - tw(T, s.to - 0.6, s.to + 0.6, E.inOut));
    s.glows[0].style.opacity = v; s.glows[1].style.opacity = v;
    s.glows[0].style.transform = `translate(${(Math.sin(T * 0.21) * 60).toFixed(1)}px, ${(Math.cos(T * 0.17) * 40).toFixed(1)}px)`;
    s.glows[1].style.transform = `translate(${(Math.cos(T * 0.19) * 70).toFixed(1)}px, ${(Math.sin(T * 0.23) * 50).toFixed(1)}px)`;
  }
  // HUD: which project
  const cur = SECS.find((s) => T >= s.from && T < s.to) || SECS[SECS.length - 1];
  const hudOn = cur.n ? tw(T, cur.from + 0.6, cur.from + 1.2) * (1 - tw(T, cur.to - 0.5, cur.to)) : 0;
  $('#hud-r').style.opacity = hudOn; $('#hud-r').style.setProperty('--hud', cur.acc);
  $('#hudband').style.opacity = hudOn;
  $('#hud-n').textContent = cur.n ? `${cur.n} / 03` : ''; $('#hud-t').textContent = cur.title || '';
  const endAt = SECS[SECS.length - 1].from;
  $('#hud-l').style.opacity = tw(T, 6.6, 7.6) * (1 - tw(T, endAt - 0.4, endAt));
  $('#hud-l .cur').style.opacity = Math.floor(T * 1.6) % 2 ? 0.2 : 1;
  // beats
  for (const b of BEATS) {
    const lt = T - b.start, on = lt >= -0.0001 && lt <= b.dur + 0.5;
    b.el.style.visibility = on ? 'visible' : 'hidden';
    if (on) b.render(lt, b.dur);
  }
  // video clips: wait for the frame
  const waits = [];
  for (const v of VIDEOS) {
    const ct = v.at(T - v.start);
    if (ct == null) continue;
    if (Math.abs(v.el.currentTime - ct) > 0.001 || v.el.readyState < 2) {
      // 'seeked' can fire before the new frame is on screen, so wait for the frame itself to be presented
      waits.push(new Promise((r) => {
        let done = false; const fin = () => { if (!done) { done = true; r(); } };
        v.el.requestVideoFrameCallback(() => fin());
        v.el.currentTime = ct;
        setTimeout(fin, 2500);
      }));
    }
  }
  return waits.length ? Promise.all(waits) : null;
}

// ---------- start ----------
assemble();
makeGlows();
window.DURATION = DURATION;
window.AUDIO = { bpm: BPM, sections: LEVELS, cues: CUES.sort((a, b) => a.t - b.t) };
window.ready = (async () => {
  await Promise.all([document.fonts.load('700 100px Inter'), document.fonts.load('800 100px Archivo'), document.fonts.load('500 20px "JetBrains Mono"'), document.fonts.load('800 60px "Plus Jakarta Sans"')]);
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => console.warn('image failed', i.src))));
  await Promise.all(VIDEOS.map((v) => new Promise((r) => { if (v.el.readyState >= 1) r(); else { v.el.addEventListener('loadedmetadata', r, { once: true }); setTimeout(r, 8000); } })));
  return { duration: DURATION };
})();

const q = new URLSearchParams(location.search);
if (!q.has('render')) {
  window.ready.then(() => {
    if (q.has('t')) return seek(+q.get('t'));
    const t0 = performance.now();
    const loop = () => { const t = (performance.now() - t0) / 1000; seek(t % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
